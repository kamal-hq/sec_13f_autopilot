[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-13f-autopilot"
version = "0.1.0"
description = "Human-approved, one-click quarterly SEC 13F update pipeline built on sec_13f_analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Kamal" },
]
dependencies = [
    "sec_13f_analyzer @ git+https://github.com/kamal-hq/sec_13f_analyzer@v1.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
autopilot = "autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "T20", # flake8-print (disallow print statements; use logging)
]
ignore = [
    "N818", # Allow control/contract exception names like NeedsManualInput
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: live SEC EDGAR smoke test requiring network and SEC_USER_AGENT (deselected by default)",
]
addopts = "-q --strict-markers -m 'not live'"
