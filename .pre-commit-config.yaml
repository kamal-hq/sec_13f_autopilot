repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # Optional: Uncomment when the `actionlint` Go binary is installed on PATH
  # (`go install github.com/rhysd/actionlint/cmd/actionlint@latest` or `winget install rhysd.actionlint`).
  # Offline workflow structural and security checks also run automatically via `pytest tests/test_workflow_security.py`.
