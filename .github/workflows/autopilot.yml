name: Quarterly 13F Autopilot

# Human-approved, one-click pipeline: triggered manually via workflow_dispatch ONLY.
# NOTE on scheduled mode: GitHub Actions automatically disables scheduled (`cron`) workflows
# on public repositories after 60 days of repository inactivity. Because 13F filings are
# quarterly (~90 days apart), a cron trigger is commented out by default. Keep manual
# `workflow_dispatch` as the primary trigger or re-enable the schedule below if desired:
#
#   schedule:
#     - cron: "0 14 15,16,17 2,5,8,11 *"  # 14:00 UTC around quarterly 13F deadlines
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Target reporting period (e.g., 2026-Q2); leave blank to auto-detect"
        required: false
        default: ""
        type: string
      llm:
        description: "LLM narrative mode (none or gemini)"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "gemini"
      as_of:
        description: "Optional historical cutoff date (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      replay:
        description: "Run in replay mode (labels outputs replay and never modifies state)"
        required: false
        default: false
        type: boolean

# Default least-privilege token permissions at workflow level
permissions:
  contents: read

concurrency:
  group: autopilot-13f-${{ inputs.period || 'auto' }}
  cancel-in-progress: false

jobs:
  autopilot-pr:
    name: Run 13F Autopilot & Open Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install sec_13f_analyzer (pinned git tag v1.1.0) and autopilot
        run: |
          python -m pip install --upgrade pip
          pip install "sec_13f_analyzer @ git+https://github.com/kamal-hq/sec_13f_analyzer@v1.1.0"
          pip install -e ".[dev]"

      - name: Cache SEC downloads and CUSIP mapping caches keyed by accession list
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            data/raw
            data/mappings
          key: sec-13f-cache-${{ runner.os }}-${{ hashFiles('reports/*/detect.json', 'reports/*/ingest.json', 'state/processed_filings.json', 'config.yaml') }}
          restore-keys: |
            sec-13f-cache-${{ runner.os }}-

      - name: Run offline pytest suite (fail fast)
        env:
          AUTOPILOT_LLM_DISABLED: "1"
        run: |
          pytest

      - name: Run autopilot pipeline through publish
        id: run_pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_PERIOD: ${{ inputs.period }}
          INPUT_LLM: ${{ inputs.llm }}
          INPUT_AS_OF: ${{ inputs.as_of }}
          INPUT_REPLAY: ${{ inputs.replay }}
        run: |
          set -euo pipefail
          PERIOD="${INPUT_PERIOD}"
          if [ -z "${PERIOD}" ]; then
            PERIOD=$(python -c "from autopilot.settings import Settings; print(Settings.from_env().target_period)")
          fi
          echo "period=${PERIOD}" >> "${GITHUB_OUTPUT}"

          ARGS=(run --through publish --period "${PERIOD}" --llm "${INPUT_LLM}")
          if [ -n "${INPUT_AS_OF}" ]; then
            ARGS+=(--as-of "${INPUT_AS_OF}")
          fi
          if [ "${INPUT_REPLAY}" = "true" ]; then
            ARGS+=(--replay)
          else
            ARGS+=(--commit-state)
          fi
          autopilot "${ARGS[@]}"

      - name: Create branch, commit artifacts, and open PR via gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
          PERIOD: ${{ steps.run_pipeline.outputs.period }}
          INPUT_REPLAY: ${{ inputs.replay }}
        run: |
          set -euo pipefail
          BRANCH="autopilot/${PERIOD}"
          if [ "${INPUT_REPLAY}" = "true" ]; then
            BRANCH="autopilot/${PERIOD}-replay"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          git add "reports/${PERIOD}/"
          if [ "${INPUT_REPLAY}" != "true" ] && [ -f "state/processed_filings.json" ]; then
            git add "state/processed_filings.json"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit for ${PERIOD}."
            exit 0
          fi

          git commit -m "chore(reports): publish ${PERIOD} 13F research note for review"
          git push --force-with-lease origin "${BRANCH}"

          EXISTING_PR=$(gh pr list --head "${BRANCH}" --base main --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING_PR}" ]; then
            gh pr edit "${EXISTING_PR}" \
              --title "Quarterly 13F Research Note: ${PERIOD}" \
              --body-file "reports/${PERIOD}/pr_body.md"
          else
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "Quarterly 13F Research Note: ${PERIOD}" \
              --body-file "reports/${PERIOD}/pr_body.md"
          fi

      - name: Upload published report artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autopilot-${{ steps.run_pipeline.outputs.period || 'run' }}-artifacts
          path: |
            reports/
            state/
          if-no-files-found: ignore
