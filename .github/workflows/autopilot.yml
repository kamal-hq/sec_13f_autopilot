name: Quarterly 13F Autopilot

# Human-approved, one-click pipeline: triggered manually via workflow_dispatch ONLY.
# NOTE on scheduled mode: GitHub Actions automatically disables scheduled (`cron`) workflows
# on public repositories after 60 days of repository inactivity. Because 13F filings are
# quarterly (~90 days apart), a cron trigger is commented out by default. Keep manual
# `workflow_dispatch` as the primary trigger or re-enable the schedule below if desired:
#
#   schedule:
#     - cron: "0 14 15,16,17 2,5,8,11 *"  # 14:00 UTC around quarterly 13F deadlines
on:
  workflow_dispatch:
    inputs:
      target_period:
        description: "Target reporting period (e.g., 2026-Q2)"
        required: true
        default: "2026-Q2"
        type: string
      llm_provider:
        description: "LLM provider selection"
        required: true
        default: "null"
        type: choice
        options:
          - "null"
          - "manual"
          - "gemini"
      dry_run:
        description: "Validate configuration and stage plan only"
        required: false
        default: true
        type: boolean

# Default least-privilege token permissions
permissions:
  contents: read

jobs:
  run-autopilot:
    name: Run 13F Autopilot Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install sec_13f_analyzer (pinned git tag v1.1.0) and autopilot
        run: |
          python -m pip install --upgrade pip
          pip install "sec_13f_analyzer @ git+https://github.com/kamal-hq/sec_13f_analyzer@v1.1.0"
          pip install -e .

      - name: Execute autopilot CLI
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          autopilot --period "${{ inputs.target_period }}" --provider "${{ inputs.llm_provider }}" $DRY_FLAG

      - name: Upload staged report and run log artifacts for human review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autopilot-${{ inputs.target_period }}-artifacts
          path: |
            reports/
            state/
          if-no-files-found: ignore
