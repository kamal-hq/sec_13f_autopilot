name: CI

# Security invariant: No pull_request or pull_request_target triggers.
on:
  push:
    branches:
      - main

# Default least-privilege token permissions
permissions:
  contents: read

env:
  AUTOPILOT_LLM_DISABLED: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint-and-test:
    name: Ruff & Pytest (Python 3.11+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install sec_13f_analyzer (pinned tag v1.1.0) and project dependencies
        run: |
          python -m pip install --upgrade pip
          # Install upstream analyzer pinned to git tag v1.1.0 when published:
          pip install "git+https://github.com/kamal-hq/sec_13f_analyzer.git@v1.1.0" || true
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff formatter check
        run: ruff format --check src tests

      - name: Run offline unit test suite
        run: pytest
